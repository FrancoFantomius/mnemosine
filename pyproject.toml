[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemosine"
version = "0.1.0"
description = "Schema-less SQLite storage library: dynamic attributes, linked files, and vector search."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["sqlite-vec>=0.1.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["mnemosine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
